<section class="page-hero">
  <div class="container stack">
    <p class="eyebrow"><a href="/het-animatieteam/">Het Animatieteam</a> &middot; {{era}}</p>
    <h1 class="display">{{title}}</h1>
    <div class="series-facts">
      <span class="match">{{match}}</span>
      <span>{{meta}}</span>
    </div>
    <p class="lead">{{description}}</p>
    {{season_links}}
  </div>
</section>

<section class="band band--deep">
  <div class="container">
    <div class="episodes">
      {{episodes}}
    </div>
  </div>
</section>

<section class="band band--paper">
  <div class="container stack-lg">
    <div>
      <p class="eyebrow">Andere suggesties</p>
      <h2 class="display d2">Nog meer van het animatieteam</h2>
    </div>
    <div class="series-grid">
      {{suggestions}}
    </div>
  </div>
</section>
